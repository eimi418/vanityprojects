<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#gradient)"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Vector Symbol: Arrow with nodes -->
  <!-- Starting node -->
  <circle cx="140" cy="256" r="24" fill="white" opacity="0.9"/>
  
  <!-- Middle nodes -->
  <circle cx="256" cy="180" r="16" fill="white" opacity="0.7"/>
  <circle cx="256" cy="332" r="16" fill="white" opacity="0.7"/>
  
  <!-- End node (larger, glowing) -->
  <circle cx="372" cy="256" r="28" fill="white"/>
  <circle cx="372" cy="256" r="20" fill="white" opacity="0.5"/>
  
  <!-- Connection lines -->
  <line x1="164" y1="256" x2="344" y2="256" stroke="white" stroke-width="8" opacity="0.8"/>
  <line x1="164" y1="256" x2="240" y2="180" stroke="white" stroke-width="6" opacity="0.6"/>
  <line x1="164" y1="256" x2="240" y2="332" stroke="white" stroke-width="6" opacity="0.6"/>
  <line x1="272" y1="180" x2="344" y2="256" stroke="white" stroke-width="6" opacity="0.6"/>
  <line x1="272" y1="332" x2="344" y2="256" stroke="white" stroke-width="6" opacity="0.6"/>
  
  <!-- Arrow head -->
  <path d="M 372 256 L 350 240 L 350 272 Z" fill="white"/>
</svg>